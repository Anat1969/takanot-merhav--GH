<title>תקנות במרחב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap">
<style>
/* פריסה: תוכן עניינים מימין, נוסח באמצע, גיליון עם מודל משמאל. חמישים גוונים של אפור, אדום רק למגבלה */
:root {
  --bg: #e6e7e9;
  --bg-deep: #d7d9dc;
  --surface: #f3f4f5;
  --surface-2: #e9ebed;
  --sheet-top: #f7f8f8;
  --sheet-bottom: #dcdfe2;
  --ink: #1c1e21;
  --ink-2: #474b51;
  --ink-3: #767b83;
  --ink-4: #a3a7ad;
  --rule: #c7cace;
  --hi-edge: rgba(255,255,255,.9);
  --sh-light: rgba(255,255,255,.85);
  --sh-dark: rgba(38,42,50,.16);
  --sh-deep: rgba(38,42,50,.26);
  --limit: #a32f27;
  --chip-bg: #1c1e21;
  --chip-fg: #f3f4f5;
  --hit: #cfd2d6;
  --model-mass: #eef0f1;
  --model-ground: #dadde0;
  --model-edge: #3b3f45;
  --model-accent: #8c9198;

  --font: 'Rubik', 'Arial Hebrew', 'Segoe UI', Arial, sans-serif;
  --w-thin: 300;
  --w-mid: 400;
  --w-strong: 500;

  --index-w: 280px;
  --measure: 60ch;
  --r-ctl: 8px;
  --r-card: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1b1d; --bg-deep: #121314; --surface: #25272a; --surface-2: #1f2123;
    --sheet-top: #2b2d30; --sheet-bottom: #17181a;
    --ink: #eceef0; --ink-2: #c3c6cb; --ink-3: #8f949b; --ink-4: #62666c; --rule: #3a3d41;
    --hi-edge: rgba(255,255,255,.07); --sh-light: rgba(255,255,255,.04); --sh-dark: rgba(0,0,0,.45); --sh-deep: rgba(0,0,0,.6);
    --limit: #e0675d; --chip-bg: #eceef0; --chip-fg: #1a1b1d; --hit: #3d4044;
    --model-mass: #3a3d41; --model-ground: #26282b; --model-edge: #c9ccd0; --model-accent: #7d828a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1b1d; --bg-deep: #121314; --surface: #25272a; --surface-2: #1f2123;
  --sheet-top: #2b2d30; --sheet-bottom: #17181a;
  --ink: #eceef0; --ink-2: #c3c6cb; --ink-3: #8f949b; --ink-4: #62666c; --rule: #3a3d41;
  --hi-edge: rgba(255,255,255,.07); --sh-light: rgba(255,255,255,.04); --sh-dark: rgba(0,0,0,.45); --sh-deep: rgba(0,0,0,.6);
  --limit: #e0675d; --chip-bg: #eceef0; --chip-fg: #1a1b1d; --hit: #3d4044;
  --model-mass: #3a3d41; --model-ground: #26282b; --model-edge: #c9ccd0; --model-accent: #7d828a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 85% 0%, var(--surface) 0%, var(--bg) 45%, var(--bg-deep) 100%) fixed, var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-weight: var(--w-thin);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }

.app {
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
  padding-inline: 16px;
  padding-block: 0 16px;
}

/* כותרת */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center;
  padding-block: 14px;
  background: linear-gradient(180deg, var(--bg) 70%, transparent);
}
.brand { display: grid; gap: 0; }
.brand h1 { margin: 0; font-size: 21px; font-weight: var(--w-mid); letter-spacing: .01em; }
.brand p { margin: 0; font-size: 12.5px; color: var(--ink-3); }

.search { position: relative; max-width: 620px; width: 100%; justify-self: center; }
.search-box {
  display: flex; align-items: center; gap: 8px;
  border-radius: 999px; padding: 6px 8px 6px 14px;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: inset 2px 3px 6px var(--sh-dark), inset -2px -2px 5px var(--sh-light);
}
.search-box input {
  flex: 1; min-width: 0; border: 0; background: transparent; padding: 6px 4px;
  font-weight: var(--w-thin); font-size: 15px;
}
.search-box input:focus { outline: none; }
.search-box:focus-within { box-shadow: inset 2px 3px 6px var(--sh-dark), inset -2px -2px 5px var(--sh-light), 0 0 0 1px var(--ink-3); }
.count { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.results {
  position: absolute; inset-inline: 0; top: calc(100% + 8px); z-index: 30;
  list-style: none; margin: 0; padding: 6px;
  border-radius: var(--r-card);
  background: linear-gradient(170deg, var(--surface), var(--surface-2));
  box-shadow: 0 18px 40px var(--sh-deep), inset 0 1px 0 var(--hi-edge);
  max-height: 60vh; overflow: auto;
}
.results li { display: grid; grid-template-columns: 5.5em 1fr; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.results li[aria-selected="true"], .results li:hover { background: var(--hit); }
.results .r-ref { color: var(--ink-3); font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
.results .r-title { font-weight: var(--w-mid); }
.results .r-snip { grid-column: 2; font-size: 13px; color: var(--ink-3); }
.results .empty { display: block; color: var(--ink-3); cursor: default; }
mark { background: var(--chip-bg); color: var(--chip-fg); border-radius: 3px; padding: 0 2px; }

.tools { display: flex; gap: 8px; }
.btn {
  border: 0; cursor: pointer; padding: 7px 14px; border-radius: var(--r-ctl);
  font-size: 13.5px; font-weight: var(--w-mid); color: var(--ink-2);
  background: linear-gradient(160deg, var(--surface), var(--surface-2));
  box-shadow: -2px -2px 5px var(--sh-light), 2px 3px 7px var(--sh-dark), inset 0 1px 0 var(--hi-edge);
  transition: box-shadow .15s, color .15s;
}
.btn:hover { color: var(--ink); }
.btn:active, .btn[aria-pressed="true"] {
  color: var(--ink);
  box-shadow: inset 2px 3px 6px var(--sh-dark), inset -2px -2px 5px var(--sh-light);
}

.notice {
  grid-column: 1 / -1;
  font-size: 12.5px; color: var(--ink-3);
  border-radius: var(--r-ctl); padding: 6px 12px;
  background: linear-gradient(90deg, var(--surface-2), transparent);
}
.notice strong { font-weight: var(--w-strong); color: var(--ink-2); }

/* שלוש עמודות */
.main {
  display: grid; gap: 20px;
  grid-template-columns: var(--index-w) minmax(0, 1fr) minmax(0, 1.25fr);
  align-items: start;
}

/* תוכן עניינים */
.index {
  position: sticky; top: 132px;
  max-height: calc(100vh - 150px); overflow: auto;
  padding: 14px 10px 14px 6px;
  border-radius: var(--r-card);
  background: linear-gradient(175deg, var(--surface) 0%, var(--surface-2) 100%);
  box-shadow: -3px -3px 8px var(--sh-light), 4px 6px 14px var(--sh-dark), inset 0 1px 0 var(--hi-edge);
}
.index details { margin-block-end: 6px; }
.index summary {
  list-style: none; cursor: pointer;
  padding: 8px 10px; border-radius: 8px;
  font-weight: var(--w-mid); font-size: 14px;
  display: flex; justify-content: space-between; gap: 8px;
}
.index summary::-webkit-details-marker { display: none; }
.index summary .part-n { color: var(--ink-3); font-weight: var(--w-thin); font-size: 12.5px; }
.index summary:hover { background: var(--hit); }
.index ul { list-style: none; margin: 0; padding: 0 0 6px; }
.index li button {
  width: 100%; border: 0; background: none; cursor: pointer; text-align: start;
  display: grid; grid-template-columns: 4.6em 1fr auto; gap: 6px; align-items: baseline;
  padding: 5px 10px; border-radius: 7px; font-size: 13.5px; color: var(--ink-2);
}
.index li button:hover { background: var(--hit); color: var(--ink); }
.index li button[aria-current="true"] {
  color: var(--ink); background: linear-gradient(160deg, var(--surface-2), var(--bg));
  box-shadow: inset 2px 2px 5px var(--sh-dark), inset -2px -2px 4px var(--sh-light);
}
.index .ref { direction: ltr; text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.index .has3d { font-size: 10.5px; font-weight: var(--w-strong); color: var(--ink); border: 1px solid var(--ink-4); border-radius: 4px; padding: 0 4px; line-height: 1.5; }
.index .group-label { padding: 8px 10px 2px; font-size: 11.5px; color: var(--ink-3); letter-spacing: .02em; }

/* נוסח */
.text {
  min-width: 0;
  padding: 26px 28px 30px;
  border-radius: var(--r-card);
  background: linear-gradient(178deg, var(--surface) 0%, var(--surface-2) 100%);
  box-shadow: -3px -3px 8px var(--sh-light), 4px 6px 16px var(--sh-dark), inset 0 1px 0 var(--hi-edge);
}
.crumb { font-size: 12.5px; color: var(--ink-3); margin-block-end: 6px; }
.text h2 { margin: 0 0 18px; font-weight: var(--w-mid); font-size: 24px; line-height: 1.3; text-wrap: balance; }
.rule { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 12px; padding-block: 14px; border-radius: 10px; }
.rule + .rule { border-top: 1px solid var(--rule); }
.rule .num { direction: ltr; text-align: right; color: var(--ink-3); font-size: 13px; padding-top: 3px; font-variant-numeric: tabular-nums; }
.rule.active .num { color: var(--ink); font-weight: var(--w-strong); }
.rule h3 { margin: 0 0 6px; font-weight: var(--w-mid); font-size: 17px; }
.rule p { margin: 0 0 8px; max-width: var(--measure); color: var(--ink-2); }
.rule .kind { font-size: 11.5px; color: var(--ink-3); letter-spacing: .02em; }
.pending { color: var(--ink-3); font-size: 13.5px; }
.pending a, .src a { color: var(--ink-2); text-underline-offset: 3px; }
.src { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }

.val {
  font-weight: var(--w-strong); color: var(--ink);
  border-radius: 5px; padding: 0 4px; margin-inline: 1px;
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  box-shadow: -1px -1px 2px var(--sh-light), 1px 2px 4px var(--sh-dark);
  cursor: pointer; white-space: nowrap; direction: rtl; unicode-bidi: isolate;
  transition: background .15s, color .15s;
}
.val.limit { color: var(--limit); }
.val:hover, .val.on { background: var(--chip-bg); color: var(--chip-fg); box-shadow: none; }
.verify {
  font-size: 10.5px; color: var(--ink-3); border: 1px dashed var(--ink-4); border-radius: 4px;
  padding: 0 4px; margin-inline-start: 2px; vertical-align: 1px; white-space: nowrap;
}
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 30% { background: var(--hit); } 100% { background: transparent; } }

/* גיליון */
.sheet {
  min-width: 0; position: sticky; top: 132px;
  border-radius: var(--r-card); overflow: hidden;
  background: linear-gradient(180deg, var(--sheet-top) 0%, var(--sheet-bottom) 100%);
  box-shadow: -3px -3px 10px var(--sh-light), 6px 10px 26px var(--sh-deep), inset 0 1px 0 var(--hi-edge);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  height: calc(100vh - 150px); min-height: 420px;
}
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px 6px; }
.sheet-head h3 { margin: 0; font-weight: var(--w-mid); font-size: 16px; }
.seg {
  display: inline-flex; padding: 3px; border-radius: 10px; gap: 2px;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: inset 2px 2px 5px var(--sh-dark), inset -2px -2px 4px var(--sh-light);
}
.seg button { border: 0; background: none; cursor: pointer; padding: 5px 12px; border-radius: 7px; font-size: 13px; color: var(--ink-3); }
.seg button[aria-pressed="true"] {
  color: var(--ink); font-weight: var(--w-mid);
  background: linear-gradient(160deg, var(--surface), var(--surface-2));
  box-shadow: 1px 2px 5px var(--sh-dark), inset 0 1px 0 var(--hi-edge);
}
.stage { position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dim-label {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  transform: translate(-50%, -50%);
  font-size: 12px; font-weight: var(--w-mid); white-space: nowrap; direction: rtl;
  padding: 1px 6px; border-radius: 5px; color: var(--ink-2);
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  box-shadow: 0 1px 4px var(--sh-dark);
  transition: background .15s, color .15s, opacity .3s;
}
.dim-label.limit { color: var(--limit); }
.dim-label.desc { font-weight: var(--w-thin); color: var(--ink-3); box-shadow: none; background: transparent; }
.dim-label.on { background: var(--chip-bg); color: var(--chip-fg); box-shadow: 0 2px 8px var(--sh-deep); }
.dim-label.hidden { opacity: 0; }
.nav3d { position: absolute; inset-inline-start: 12px; bottom: 12px; display: flex; gap: 6px; }
.nav3d .btn { padding: 5px 10px; font-size: 12.5px; }
.empty-stage { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 24px; color: var(--ink-3); }
.empty-stage strong { color: var(--ink-2); font-weight: var(--w-mid); }
.empty-stage .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.titleblock {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--rule); font-size: 12px;
  background: linear-gradient(180deg, transparent, var(--sh-light));
}
.titleblock div { padding: 7px 12px; border-inline-start: 1px solid var(--rule); min-width: 0; }
.titleblock div:first-child { border-inline-start: 0; }
.titleblock span { display: block; color: var(--ink-3); font-size: 11px; }
.titleblock b { font-weight: var(--w-mid); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1100px) {
  .main { grid-template-columns: var(--index-w) minmax(0, 1fr); }
  .sheet { grid-column: 1 / -1; grid-row: 1; position: relative; top: 0; height: 58vh; }
  .index { max-height: none; }
}
@media (max-width: 760px) {
  .top { grid-template-columns: 1fr; gap: 10px; position: static; }
  .search { justify-self: stretch; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .index { position: static; order: 3; }
  .sheet { height: 56vh; min-height: 340px; }
  .text { padding: 20px 16px; }
  .rule { grid-template-columns: 1fr; gap: 2px; }
  .rule .num { text-align: start; direction: rtl; }
  .titleblock { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .titleblock div:nth-child(3) { border-inline-start: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app" dir="rtl" lang="he">
  <header class="top">
    <div class="brand">
      <h1>תקנות במרחב</h1>
      <p>התוספת השנייה לתקנות התכנון והבנייה (בקשה להיתר, תנאיו ואגרות), תש״ל־1970</p>
    </div>
    <div class="search" role="search">
      <div class="search-box">
        <input id="q" type="search" autocomplete="off" placeholder="חיפוש לפי מילה או מספר סעיף, למשל: מעקה, 3.2.2.5" aria-label="חיפוש בתקנות" aria-controls="results" aria-expanded="false">
        <span class="count" id="count"></span>
      </div>
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <div class="tools">
      <button class="btn" id="themeBtn" type="button">תצוגה כהה</button>
    </div>
    <p class="notice"><strong>גרסת MVP.</strong> מבנה הסעיפים וכותרותיהם לפי נבו. התמציות נכתבו לעבודה ואינן הנוסח, והערכים המסומנים ״לאימות״ טעונים בדיקה מול הנוסח הרשמי לפני כל שימוש.</p>
  </header>

  <main class="main">
    <nav class="index" id="index" aria-label="תוכן עניינים"></nav>

    <article class="text" id="text" aria-live="polite"></article>

    <section class="sheet" aria-label="גיליון המחשה">
      <div class="sheet-head">
        <h3 id="sceneTitle">המחשה</h3>
        <div class="seg" role="group" aria-label="תצוגה">
          <button type="button" data-view="plan" aria-pressed="false">תכנית</button>
          <button type="button" data-view="section" aria-pressed="false">חתך</button>
          <button type="button" data-view="axon" aria-pressed="true">אקסונומטריה</button>
        </div>
      </div>
      <div class="stage" id="stage">
        <canvas id="canvas" aria-hidden="true"></canvas>
        <div class="labels" id="labels"></div>
        <div class="empty-stage" id="emptyStage" hidden></div>
        <div class="nav3d">
          <button class="btn" type="button" id="resetBtn">חזרה לתצוגת המוצא</button>
        </div>
      </div>
      <div class="titleblock" id="titleblock"></div>
      <table class="sr-only" id="dimTable"></table>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
'use strict';

/* ---------- נתונים: מקור האמת היחיד. כל מספר במודל ובנוסח נקרא מכאן ---------- */
const NEVO = 'https://www.nevo.co.il/law_html/law01/044_046.htm';

// verified:false = הערך לא נבדק מול הנוסח הרשמי
const PARAMS = {
  room_height_min:   { op: '>=', v: 2.50, u: 'm',   label: 'גובה חדר מגורים',            rule: '2.03', verified: false },
  room_width_min:    { op: '>=', v: 2.50, u: 'm',   label: 'רוחב בין קירות',             rule: '2.04', verified: false },
  room_area_min:     { op: '>=', v: 8,    u: 'm2',  label: 'שטח חדר מגורים',             rule: '2.04', verified: false },
  window_ratio_min:  { op: '>=', v: 0.10, u: 'ratio', label: 'שטח חלון ביחס לשטח הרצפה', rule: '2.21', verified: false },
  balcony_ratio_max: { op: '<=', v: 0.40, u: 'ratio', label: 'בליטת מרפסת מתוך המרווח',  rule: '4.03', verified: false },
  balcony_abs_max:   { op: '<=', v: 2.00, u: 'm',   label: 'בליטת מרפסת, לכל היותר',     rule: '4.03', verified: false },
  riser_max:         { op: '<=', v: 0.175, u: 'm',  label: 'רום מדרגה',                  rule: '3.2.2.5', verified: false },
  tread_min:         { op: '>=', v: 0.26, u: 'm',   label: 'שלח מדרגה',                  rule: '3.2.2.5', verified: false },
  headroom_min:      { op: '>=', v: 2.05, u: 'm',   label: 'גובה מזקף ראש',              rule: '3.2.2.4', verified: false },
  steps_per_flight_max: { op: '<=', v: 18, u: 'count', label: 'מדרגות במהלך אחד',       rule: '3.2.2.6', verified: false },
  railing_height_min:{ op: '>=', v: 1.05, u: 'm',   label: 'גובה מעקה',                  rule: '3.2.2.14', verified: false },
  door_width_min:    { op: '>=', v: 0.80, u: 'm',   label: 'רוחב פתח פנוי',              rule: '3.2.1.3', verified: false },
  door_height_min:   { op: '>=', v: 2.00, u: 'm',   label: 'גובה דלת',                   rule: '3.2.1.4', verified: false },
  walk_max:          { op: '<=', v: 20,   u: 'm',   label: 'מרחק הליכה',                 rule: '3.2.15.9', verified: false }
};

// גיאומטריית רקע בלבד (לא ערכים רגולטוריים)
const FIX = {
  plotDepth: 12, setback: 4.0, buildingDepth: 9, buildingWidth: 10, floorH: 3.0, floors: 3,
  roomLength: 4.2, slab: 0.25, windowSill: 0.9, windowH: 1.2,
  personH: 1.70, flightSteps: 12, corridorW: 1.6, aptDepth: 7.5, aptW: 6.0, apts: 4, stairW: 3.0

/* ---------- עזרי פורמט ---------- */
function fmt(key) {
  const p = PARAMS[key];
  if (!p) return '?';
  let s;
  if (p.u === 'm') s = (p.v < 1 ? (p.v * 100).toFixed(p.v * 100 % 1 ? 1 : 0) + ' ס״מ' : p.v.toFixed(2) + ' מ׳');
  else if (p.u === 'm2') s = p.v + ' מ״ר';
  else if (p.u === 'ratio') s = Math.round(p.v * 100) + '%';
  else s = String(p.v);
  return s;
}
function opSign(key) { const o = PARAMS[key].op; return o === '>=' ? '≥' : o === '<=' ? '≤' : o; }
function isLimit(key) { const o = PARAMS[key].op; return o === '>=' || o === '<=' || o === '<' || o === '>'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---------- חיפוש עברי ---------- */
function norm(s) {
  return String(s).replace(/[֑-ׇ]/g, '').replace(/[״"׳'`]/g, '')
    .replace(/ך/g, 'כ').replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ף/g, 'פ').replace(/ץ/g, 'צ')
    .replace(/יי/g, 'י').replace(/וו/g, 'ו').toLowerCase().trim();
}
function variants(tok) {
  const out = [tok];
  let t = tok;
  for (let i = 0; i < 2; i++) {
    if (t.length > 3 && 'והבלמשכ'.indexOf(t[0]) >= 0) { t = t.slice(1); out.push(t); } else break;
  }
  const extra = [];
  SYN.forEach(function (g) {
    const ng = g.map(norm);
    if (out.some(function (v) { return ng.indexOf(v) >= 0; })) ng.forEach(function (x) { extra.push(x); });
  });
  return out.concat(extra);
}
const DOCS = Object.keys(SECTIONS).map(function (ref) {
  const s = SECTIONS[ref], r = RULES[ref];
  const bodyPlain = r ? r.body.join(' ').replace(/\{(\w+)\}/g, function (_, k) { return fmt(k); }) : '';
  return { ref: ref, title: s.title, part: s.part.n, body: bodyPlain, kw: r ? r.kw.join(' ') : '',
    nTitle: norm(s.title), nBody: norm(bodyPlain), nKw: r ? norm(r.kw.join(' ')) : '' };
});
function wordHit(hay, v) {
  if (!v) return false;
  if (v.indexOf(' ') >= 0) return hay.indexOf(v) >= 0;
  return (' ' + hay).split(/\s+/).some(function (w) { return w.indexOf(v) === 0 || (w.length > 2 && w.slice(1).indexOf(v) === 0 && 'והבלמשכ'.indexOf(w[0]) >= 0); });
}
function search(q) {
  const raw = q.trim();
  if (!raw) return [];
  if (/^\d+(\.\d+)*\.?$/.test(raw)) {
    const p = raw.replace(/\.$/, '');
    return DOCS.filter(function (d) { return d.ref === p || d.ref.indexOf(p + '.') === 0 || d.ref.indexOf(p) === 0; })
      .map(function (d) { return { d: d, score: d.ref === p ? 100 : 50, terms: [] }; });
  }
  const toks = norm(raw).split(/\s+/).filter(Boolean);
  const phrase = norm(raw);
  const res = [];
  DOCS.forEach(function (d) {
    let score = 0, all = true;
    toks.forEach(function (t) {
      const vs = variants(t);
      let s = 0;
      vs.forEach(function (v, i) {
        const w = i === 0 ? 1 : .7;
        if (wordHit(d.nTitle, v)) s = Math.max(s, 10 * w);
        else if (wordHit(d.nKw, v)) s = Math.max(s, 7 * w);
        else if (wordHit(d.nBody, v)) s = Math.max(s, 4 * w);
      });
      if (!s) all = false;
      score += s;
    });
    if (toks.length > 1 && d.nTitle.indexOf(phrase) >= 0) score += 15;
    if (all && score) res.push({ d: d, score: score + (RULES[d.ref] ? 1 : 0), terms: toks });
  });
  return res.sort(function (a, b) { return b.score - a.score; });
}
function highlight(text, terms) {
  if (!terms || !terms.length) return esc(text);
  // מסמן מילים שתחילתן (אחרי תחילית) תואמת אחד המונחים
  return text.split(/(\s+)/).map(function (w) {
    if (/^\s+$/.test(w)) return w;
    const nw = norm(w);
    const hit = terms.some(function (t) {
      return variants(t).some(function (v) { return v.indexOf(' ') < 0 && v.length > 1 && (nw.indexOf(v) === 0 || (nw.length > 2 && 'והבלמשכ'.indexOf(nw[0]) >= 0 && nw.slice(1).indexOf(v) === 0)); });
    });
    return hit ? '<mark>' + esc(w) + '</mark>' : esc(w);
  }).join('');
}

function init3D() {

function fitCamera(resetPos) {
  if (!camera || !bounds) return;
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1, aspect = w / h;
  const size = bounds.getSize(new THREE.Vector3()), c = bounds.getCenter(new THREE.Vector3());
  let span;
  if (view === 'plan') span = Math.max(size.x / aspect, size.z) * .62;

    else { camera.position.set(c.x - d * .62, c.y + d * .52, c.z + d * .62); camera.up.set(0, 1, 0); }

}

}
// מידה: קו עם סימני חיתוך ב־45°, קווי עזר ותווית. key = פרמטר רגולטורי, אחרת מידה תיאורית

/* ---------- סצנות: מקבלות ערכים מ־PARAMS בלבד ---------- */
const P = function (k) { return PARAMS[k].v; };
const BUILD = {
  room: function () {
    const H = P('room_height_min'), W = Math.max(P('room_width_min'), P('room_area_min') / FIX.roomLength), L = FIX.roomLength, t = .2;
    ground(L + 6, W + 6, 0, 0);
    box(L + 2 * t, FIX.slab, W + 2 * t, 0, -FIX.slab + .001, 0, { grow: false });
    box(t, H, W + 2 * t, -L / 2 - t / 2, 0, 0);            // קיר אחורי
    box(L, H, t, 0, 0, -W / 2 - t / 2);                    // קיר צד
    box(L + 2 * t, .2, W + 2 * t, 0, H, 0, { mat: MAT.massSoft, soft: true, shadow: false });   // תקרה שקופה

    dim([L / 2, 0, -W / 2], [L / 2, 0, W / 2], [.8, 0, 0], 'room_width_min', opSign('room_width_min') + ' ' + fmt('room_width_min'));
    dim([-L / 2, 0, W / 2], [L / 2, 0, W / 2], [0, 0, 1.6], null);

  },

    box(t, wh, (W - ww) / 2, -L / 2, sill, -(W + ww) / 4 - 0.0);
    box(t, wh, (W - ww) / 2, -L / 2, sill, (W + ww) / 4);
    box(.04, wh, ww, -L / 2, sill, 0, { mat: MAT.glass, soft: true, shadow: false });
    box(L, Hh, t, 0, 0, -W / 2 - t / 2);

  balcony: function () {

    const leaf = box(.05, dh - .02, dw - .04, 0, 0, 0, { mat: MAT.accent, shadow: true });
    leaf.position.set(-dw / 2 + .03, 0, t / 2 + (dw - .04) / 2);
    dim([-dw / 2, 0, t / 2], [dw / 2, 0, t / 2], [0, 0, 1.4], 'door_width_min');
    dim([dw / 2, 0, t / 2], [dw / 2, dh, t / 2], [.7, 0, 0], 'door_height_min');
    person(1.3, 1.2);
    return [Ww + 2, Hw + .5, 4];
  },
  walking: function () {
    const n = FIX.apts, aw = FIX.aptW, ad = FIX.aptDepth, cw = FIX.corridorW, sw = FIX.stairW;
    const len = n * aw, H = 2.9;
    ground(len + sw + 6, 2 * ad + cw + 6, (len + sw) / 2 - sw / 2, 0);
    for (let i = 0; i < n; i++) {
      const x = sw + i * aw + aw / 2;
      box(aw - .2, H, ad, x, 0, -(cw / 2 + ad / 2), { mat: MAT.massSoft, soft: true, shadow: false });
      if (i < n - 1) box(aw - .2, H, ad, x, 0, cw / 2 + ad / 2, { mat: MAT.massSoft, soft: true, shadow: false });
    }
    box(sw - .2, H + .4, cw + 2 * ad * .6, sw / 2, 0, 0);       // חדר מדרגות מוגן
    label('חדר מדרגות מוגן', [sw / 2, H + 1.1, 0], 'desc');
    // מסלול: מדלת הדירה הרחוקה, לאורך הפרוזדור, עד דלת חדר המדרגות
    const far = sw + (n - 1) * aw + aw / 2;
    const pts = [[far, .05, -cw / 2], [far, .05, 0], [sw, .05, 0]];
    const pl = line(pts, MAT.path);
    let L = 0; for (let i = 1; i < pts.length; i++) L += new THREE.Vector3().fromArray(pts[i]).distanceTo(new THREE.Vector3().fromArray(pts[i - 1]));
    const ok = L <= P('walk_max');
    const dot = new THREE.Mesh(new THREE.SphereGeometry(.18, 16, 12), new THREE.MeshStandardMaterial({ color: col('--ink') }));
    dot.position.set(far, .2, -cw / 2); scene3.add(dot); dot.userData.path = pts; dot.userData.len = L;
    walker = dot;
    const d = label('מסלול במודל ' + L.toFixed(1) + ' מ׳, מותר ' + opSign('walk_max') + ' ' + fmt('walk_max') + (ok ? '' : ', חריגה'), [(far + sw) / 2, .3, .7], 'limit', 'walk_max');
    d.lines = [pl]; d.baseMat = MAT.path;
    label('דלת הדירה הרחוקה', [far, .3, -cw / 2 - .8], 'desc');
    person(far - 1.2, .3);
    return [len + sw + 2, H + 2, 2 * ad + cw + 2];
  }
};
let walker = null;

function loadScene(id, force) {
  const sheetTitle = document.getElementById('sceneTitle');
  if (!id) {
    currentScene = null; clearScene(); scene3 = null;
    if (renderer) renderer.clear();
    sheetTitle.textContent = 'אין המחשה לסעיף זה';
    emptyEl.hidden = false;
    const near = Object.keys(SCENES).map(function (k) { return '<button class="btn" type="button" data-ref="' + SCENES[k].rules[0] + '">' + esc(SCENES[k].title) + '</button>'; }).join('');
    emptyEl.innerHTML = '<strong>הסעיף עדיין לא מומחש.</strong><span>ההמחשות הקיימות בגרסה זו:</span><div class="links">' + near + '</div>';
    buildDimTable();
    return;
  }
  emptyEl.hidden = true;
  if (id === currentScene && !force) { setActiveKey(null); return; }
  currentScene = id;
  sheetTitle.textContent = SCENES[id].title;
  if (!has3D) {
    emptyEl.hidden = false;
    emptyEl.innerHTML = '<strong>המודל לא נטען.</strong><span>רעננו את הדף. הנוסח והערכים זמינים בעמודה הסמוכה.</span>';
    buildDimTable(); return;
  }
  clearScene();
  scene3 = new THREE.Scene();
  makeMats(); lights(); walker = null;
  const ext = BUILD[id]();
  bounds = new THREE.Box3();
  scene3.traverse(function (o) { if (o.isMesh && o.geometry.type !== 'PlaneGeometry') bounds.expandByObject(o); });
  dims.forEach(function (d) { bounds.expandByPoint(d.pos); });
  frame = 0;
  growers.forEach(function (g) { g.userData.sy = g.scale.y; g.scale.y = reduce ? g.userData.sy : .001; });
  dims.forEach(function (d) { if (!reduce) d.el.classList.add('hidden'); });
  fitCamera(true);
  buildDimTable();
}
emptyEl.addEventListener('click', function (e) { const b = e.target.closest('[data-ref]'); if (b) go(b.dataset.ref); });

function setActiveKey(k, scrollToText) {
  activeKey = k;
  dims.forEach(function (d) {
    const on = !!k && d.key === k;
    d.el.classList.toggle('on', on);
    (d.lines || []).forEach(function (l) { l.material = on ? MAT.on : l.userData.base; });
  });
  textEl.querySelectorAll('.val').forEach(function (v) { v.classList.toggle('on', !!k && v.dataset.key === k); });
  if (k && scrollToText) {
    const v = textEl.querySelector('.val[data-key="' + k + '"]');
    if (v) { const sec = v.closest('.rule'); v.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }); if (sec) { sec.classList.remove('flash'); void sec.offsetWidth; sec.classList.add('flash'); } }
  }
}
labelsEl.addEventListener('mouseover', function (e) { const l = e.target.closest('.dim-label[data-key]'); if (l) setActiveKey(l.dataset.key); });
labelsEl.addEventListener('mouseout', function (e) { const l = e.target.closest('.dim-label[data-key]'); if (l) setActiveKey(null); });
labelsEl.addEventListener('click', function (e) {
  const l = e.target.closest('.dim-label[data-key]'); if (!l) return;
  const ref = PARAMS[l.dataset.key].rule;
  if (ref !== current) { current = ref; renderText(); markIndex(); updateTitleBlock(); }
  setActiveKey(l.dataset.key, true);
});

function tick() {
  requestAnimationFrame(tick);
  if (!renderer || !scene3 || !camera) return;
  frame++;
  if (!reduce && frame <= 40) {
    const t = frame / 40, e = 1 - Math.pow(1 - t, 3);
    growers.forEach(function (g) { g.scale.y = Math.max(.001, e * g.userData.sy); });
    if (frame === 40) dims.forEach(function (d) { d.el.classList.remove('hidden'); });
  }
  if (walker && !reduce) {
    const pts = walker.userData.path, L = walker.userData.len, s = ((performance.now() / 1000) * 2.2) % (L + 3);
    let rem = Math.min(s, L), i = 1;
    for (; i < pts.length; i++) {
      const a = new THREE.Vector3().fromArray(pts[i - 1]), b = new THREE.Vector3().fromArray(pts[i]), seg = a.distanceTo(b);
      if (rem <= seg) { walker.position.copy(a.lerp(b, rem / seg)); walker.position.y = .2; break; }
      rem -= seg;
    }
  }
  if (controls) controls.update();
  renderer.render(scene3, camera);
  const w = stage.clientWidth, h = stage.clientHeight, v = new THREE.Vector3();
  dims.forEach(function (d) {
    v.copy(d.pos).project(camera);
    d.el.style.transform = 'translate(' + ((v.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - v.y) / 2 * h).toFixed(1) + 'px) translate(-50%,-50%)';
  });
}

/* ---------- תצוגות ---------- */
document.querySelectorAll('.seg button').forEach(function (b) {
  b.addEventListener('click', function () {
    view = b.dataset.view;
    document.querySelectorAll('.seg button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    fitCamera(true); updateTitleBlock();
  });
});
document.getElementById('resetBtn').addEventListener('click', function () { fitCamera(true); });

/* ---------- טבלת כותרת וטבלה לנגישות ---------- */
function updateTitleBlock() {
  const s = SECTIONS[current]; if (!s) return;
  const r = RULES[current];
  const keys = r ? Object.keys(PARAMS).filter(function (k) { return SCENES[r.scene].rules.indexOf(PARAMS[k].rule) >= 0; }) : [];
  const unverified = keys.filter(function (k) { return !PARAMS[k].verified; }).length;
  const viewName = { plan: 'תכנית', section: 'חתך', axon: 'אקסונומטריה' }[view];
  document.getElementById('titleblock').innerHTML =
    '<div><span>תקנה</span><b>' + s.ref + '</b></div>' +
    '<div><span>נושא</span><b>' + esc(s.title) + '</b></div>' +
    '<div><span>תצוגה</span><b>' + (r ? viewName : 'אין') + '</b></div>' +
    '<div><span>מצב הערכים</span><b>' + (r ? (unverified ? unverified + ' לאימות' : 'נבדקו') : 'טרם הוזנו') + '</b></div>';
}
function buildDimTable() {
  const t = document.getElementById('dimTable');
  const rows = dims.filter(function (d) { return d.key; }).map(function (d) {
    const p = PARAMS[d.key];
    return '<tr><td>' + esc(p.label) + '</td><td>' + opSign(d.key) + ' ' + fmt(d.key) + '</td><td>תקנה ' + p.rule + '</td></tr>';
  }).join('');
  t.innerHTML = '<caption>מידות בהמחשה</caption><tr><th>פרמטר</th><th>ערך</th><th>סעיף</th></tr>' + rows;
}

/* ---------- הפעלה ---------- */
syncThemeBtn();
buildIndex();
init3D();
go(fromHash() || '3.2.2.5');
window.addEventListener('hashchange', function () { const h = fromHash(); if (h && h !== current) go(h); });
})();
</script>
